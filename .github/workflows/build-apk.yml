name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk StrideClash.apk

      # Updates the same "latest" release on every push instead of creating
      # a new one each time, so releases/latest/download/StrideClash.apk
      # (linked from docs/index.html) always resolves to the newest build.
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build automático (main)
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Sempre a versão mais recente da branch `main`.
          files: StrideClash.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
