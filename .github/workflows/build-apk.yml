name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # mobile/.env é gitignored (nunca commitado) mas pubspec.yaml o declara
      # como asset obrigatório — sem ele o build falha com "No file or
      # variants found for asset: .env". Precisa vir de secrets do repositório
      # (Settings > Secrets and variables > Actions):
      #   MOBILE_GOOGLE_CLIENT_ID, MOBILE_GRPC_HOST, MOBILE_GRPC_PORT,
      #   MOBILE_GRPC_USE_TLS
      - name: Create mobile/.env
        working-directory: mobile
        run: |
          cat > .env << EOF
          GOOGLE_CLIENT_ID=${{ secrets.MOBILE_GOOGLE_CLIENT_ID }}
          GRPC_HOST=${{ secrets.MOBILE_GRPC_HOST }}
          GRPC_PORT=${{ secrets.MOBILE_GRPC_PORT }}
          GRPC_USE_TLS=${{ secrets.MOBILE_GRPC_USE_TLS }}
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk StrideClash.apk

      # Updates the same "latest" release on every push instead of creating
      # a new one each time, so releases/latest/download/StrideClash.apk
      # (linked from docs/index.html) always resolves to the newest build.
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build automático (main)
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Sempre a versão mais recente da branch `main`.
          files: StrideClash.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
