syntax = "proto3";

package walk;

option go_package = "github.com/PatrickCalorioCarvalho/StrideClash/backend/proto;pb";

import "google/protobuf/timestamp.proto";

service WalkService {
  rpc StartWalk(StartWalkRequest) returns (StartWalkResponse);
  rpc FinishWalk(FinishWalkRequest) returns (FinishWalkResponse);
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
}

message GetUserStatsRequest {
  string user_id = 1;
}

message GetUserStatsResponse {
  double total_area_m2 = 1;
  int32 walk_count = 2;
}

message StartWalkRequest {
  string user_id = 1;
  string championship_id = 2;
}

message StartWalkResponse {
  string walk_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

message FinishWalkRequest {
  string walk_id = 1;
  repeated WalkPoint points = 2;
}

message FinishWalkResponse {
  string polygon_wkt = 1;
  double area_m2 = 2;
}

message WalkPoint {
  double lat = 1;
  double lng = 2;
  google.protobuf.Timestamp timestamp = 3;
  double speed = 4;
}
