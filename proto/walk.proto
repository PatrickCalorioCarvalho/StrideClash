syntax = "proto3";

package walk;

option go_package = "github.com/PatrickCalorioCarvalho/StrideClash/backend/proto;pb";

import "google/protobuf/timestamp.proto";

service WalkService {
  rpc SyncWalk(SyncWalkRequest) returns (SyncWalkResponse);
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
  rpc ListMyWalks(ListMyWalksRequest) returns (ListMyWalksResponse);
  rpc ListAllMyWalks(ListAllMyWalksRequest) returns (ListAllMyWalksResponse);
  rpc DeleteWalk(DeleteWalkRequest) returns (DeleteWalkResponse);
}

// SyncWalk uploads a walk recorded entirely offline: the client generates
// its own id and keeps the walk (and every GPS point) locally the whole
// time, then calls this once network is available. Safe to retry —
// syncing the same client_walk_id twice just replays the same result.
message SyncWalkRequest {
  string client_walk_id = 1;
  string user_id = 2;
  string championship_id = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  repeated WalkPoint points = 6;
}

message SyncWalkResponse {
  string polygon_wkt = 1;
  double area_m2 = 2;
  // false quando o servidor descartou o polígono (GPS parado, não fechou
  // perto do início, ou velocidade incompatível com caminhada) — a
  // caminhada em si continua salva, só não conta território.
  bool valid = 3;
  string invalid_reason = 4;
}

message WalkPoint {
  double lat = 1;
  double lng = 2;
  google.protobuf.Timestamp timestamp = 3;
  double speed = 4;
}

message GetUserStatsRequest {
  string user_id = 1;
}

message GetUserStatsResponse {
  double total_area_m2 = 1;
  int32 walk_count = 2;
  repeated ChampionshipStat by_championship = 3;
}

// Per-championship breakdown of a user's walked area. Walks whose
// championship was deleted (championship_id set NULL) or that were never
// tied to one are grouped together with championship_id empty.
message ChampionshipStat {
  string championship_id = 1;
  string championship_name = 2;
  double area_m2 = 3;
  int32 walk_count = 4;
}

// Drills into one ChampionshipStat group — championship_id empty means the
// same "sem campeonato" group ChampionshipStat groups under an empty id.
message ListMyWalksRequest {
  string user_id = 1;
  string championship_id = 2;
}

message ListMyWalksResponse {
  repeated WalkSummary walks = 1;
}

message WalkSummary {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  double area_m2 = 4;
}

// Lists every one of the user's walks, valid or not — unlike ListMyWalks
// (which drills into one ChampionshipStat group and only ever shows valid
// captures), this is the full history, so an invalidated walk's pace/speed
// can be inspected to see why it got rejected.
message ListAllMyWalksRequest {
  string user_id = 1;
}

message ListAllMyWalksResponse {
  repeated WalkDetail walks = 1;
}

message WalkDetail {
  string id = 1;
  string championship_id = 2;
  string championship_name = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  double area_m2 = 6;
  bool valid = 7;
  string invalid_reason = 8;
  double distance_m = 9;
  double avg_speed_mps = 10;
}

message DeleteWalkRequest {
  string walk_id = 1;
  string user_id = 2;
}

message DeleteWalkResponse {
  bool success = 1;
}
