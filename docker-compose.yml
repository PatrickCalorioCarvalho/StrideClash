services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: strideclash_postgres
    restart: always

    environment:
      POSTGRES_DB: strideclash
      POSTGRES_USER: strideclash
      POSTGRES_PASSWORD: strideclash123

    ports:
      # 5434 (não 5433): evita conflito de porta com o Postgres do
      # CLKThingsManager, que usa 5433 e pode estar rodando no mesmo host.
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strideclash -d strideclash"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: strideclash_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # O backend em container sempre fala com o serviço "postgres" acima,
      # na porta interna 5432 — não com o host:5434 exposto pro seu ambiente
      # local. Isso vale mesmo que o seu .env tenha outros valores de DB_*
      # (esses são só pra rodar `go run` fora do Docker).
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: strideclash
      DB_PASSWORD: strideclash123
      DB_NAME: strideclash
      DB_SSLMODE: disable
    ports:
      - "50051:50051"
    # "default" = a rede própria deste projeto (fala com postgres acima);
    # "edge" = rede compartilhada do gateway de homologação (Traefik, no
    # HomeLabDevelopment) - só existe se este projeto rodar na MESMA vm-docker
    # do gateway. Ver docs/HOMOLOGACAO.md lá.
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stride-clash-grpc.rule=PathPrefix(`/auth.AuthService`) || PathPrefix(`/game.ChampionshipService`) || PathPrefix(`/walk.WalkService`)"
      - "traefik.http.routers.stride-clash-grpc.priority=100"
      # h2c: o grpc.NewServer() deste backend roda sem TLS - ver
      # docker-compose.ngrok.yml pro mesmo motivo (endpoints TCP/TLS do ngrok
      # exigem cartão).
      - "traefik.http.services.stride-clash-grpc.loadbalancer.server.scheme=h2c"
      - "traefik.http.services.stride-clash-grpc.loadbalancer.server.port=50051"

networks:
  edge:
    external: true

volumes:
  postgres_data:
